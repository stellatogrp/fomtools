name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ "3.13" ]

    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/checkout@v4

      - name: Upgrade setuptools/build
        run: |
            pip install wheel --upgrade
            pip install setuptools --upgrade
            python -m pip install --upgrade build

      - name: Build wheels for package
        run: python -m build

      - name: Install Package with docs extra
        run: pip install ."[docs, cvxpygen]"

      - name: List dependencies
        run: pip freeze

      - shell: bash
        id: write-license
        env:
          LICENSE: ${{ secrets.GUROBI_LICENSE}}
        run: |
          echo "$LICENSE" > $PWD/gurobi.lic

      - name: Check Gurobi License
        env:
          GRB_LICENSE_FILE: ${{ github.workspace }}/gurobi.lic
        run: python -c "import gurobipy; gurobipy.Model()"

      - name: Export marimo notebooks
        env:
          GRB_LICENSE_FILE: ${{ github.workspace }}/gurobi.lic
        run: |
          for file in docs/tutorials/*.py; do
            marimo export html "$file" -o "${file%.py}.html"
          done

      - name: Verify html generation
        run: ls docs/tutorials

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Set weekly cache ID
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Cache MkDocs Material build files
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Build MkDocs site
        run: mkdocs build

      # Pull requests only build the site; pushes to main publish it to the gh-pages
      # branch, which GitHub Pages serves at https://stellatogrp.github.io/fomtools/
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
