name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ "3.12" ]

    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/checkout@v4

      - name: Build wheels for package
        run: python -m build

      - name: Stage wheel into docs/static
        run: | 
          mkdir -p docs/static 
          cp dist/*-py3-none-any.whl docs/static/yourpkg-latest-py3-none-any.whl

      - name: Install Package with docs extra
        run: pip install .[docs]

      - name: List dependencies
        run: pip freeze

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Set weekly cache ID
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Cache MkDocs Material build files
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Deploy
        run: mkdocs gh-deploy --force