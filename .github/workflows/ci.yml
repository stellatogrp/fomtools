name: Python build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        uses: chartboost/ruff-action@v1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS (needed for SCS)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        # Install a specific uv version using the installer
        run: curl -LsSf https://astral.sh/uv/0.4.1/install.sh | sh

      - shell: bash
        id: write-license
        name: Write License
        env:
          LICENSE: ${{ secrets.GUROBI_LICENSE }}
        run: |
          echo "$LICENSE" > $PWD/gurobi.lic

      - name: Install the project
        run: uv sync --extra dev --extra docs

      - name: Check Gurobi License
        env:
          GRB_LICENSE_FILE: ${{ github.workspace }}/gurobi.lic
        run: uv run python -c "import gurobipy; gurobipy.Model()"

      - name: Run tests
        env:
          GRB_LICENSE_FILE: ${{ github.workspace }}/gurobi.lic
        run: uv run pytest tests
