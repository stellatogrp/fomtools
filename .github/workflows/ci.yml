name: Python build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ruff
        uses: chartboost/ruff-action@v1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"

      - name: Build wheel
        run: uv build --wheel

      - name: Install into clean venv (no extras)
        run: |
          uv venv /tmp/pkg-test
          uv pip install --python /tmp/pkg-test/bin/python dist/*.whl

      - name: Smoke-test import and CLI
        run: |
          /tmp/pkg-test/bin/python -c "import fomtools; print(fomtools.__version__)"
          /tmp/pkg-test/bin/fomtools-codegen --help

      - name: Verify HiGHS default works
        run: |
          /tmp/pkg-test/bin/python -c "
          from fomtools.verifier import Verifier
          v = Verifier()
          assert v.canonicalizer.solver.__class__.__name__ == 'HiGHSSolver'
          print('HiGHS default: OK')
          "

      - name: Verify Gurobi ImportError message
        run: |
          /tmp/pkg-test/bin/python -c "
          import sys
          from fomtools.verifier import Verifier
          try:
              Verifier(solver='gurobi')
              sys.exit('expected ImportError')
          except ImportError as e:
              assert 'fomtools[gurobi]' in str(e)
              print(f'ImportError hint: OK ({e})')
          "

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS (needed for SCS)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"

      - shell: bash
        id: write-license
        env:
          LICENSE: ${{ secrets.GUROBI_LICENSE}}
        run: |
          echo "$LICENSE" > $PWD/gurobi.lic

      - name: Install the project
        run: uv sync --extra dev --extra docs --extra nn --extra cvxpygen

      - name: Check Gurobi License
        env:
          GRB_LICENSE_FILE: ${{ github.workspace }}/gurobi.lic
        run: uv run --frozen python -c "import gurobipy; gurobipy.Model()"

      - name: Run tests
        env:
            GRB_LICENSE_FILE: ${{ github.workspace }}/gurobi.lic
        run: uv run --frozen pytest tests
