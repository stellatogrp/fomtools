name: Python build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ruff
        uses: chartboost/ruff-action@v1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS (needed for SCS)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pin the same uv that generates uv.lock locally, so CI reads the
          # lockfile instead of silently falling back to a fresh resolution.
          version: "0.11.15"
          enable-cache: true

      - shell: bash
        id: write-license
        env:
          LICENSE: ${{ secrets.GUROBI_LICENSE}}
        run: |
          echo "$LICENSE" > $PWD/gurobi.lic

      - name: Install the project
        env:
          # Use the interpreter set up above rather than downloading another.
          UV_PYTHON_DOWNLOADS: never
        run: >
          uv sync --locked --python ${{ matrix.python-version }}
          --extra dev --extra docs --extra nn --extra cvxpygen

      - name: Check Gurobi License
        env:
          GRB_LICENSE_FILE: ${{ github.workspace }}/gurobi.lic
        run: uv run --frozen python -c "import gurobipy; gurobipy.Model()"

      - name: Run tests
        env:
            GRB_LICENSE_FILE: ${{ github.workspace }}/gurobi.lic
        run: uv run --frozen pytest tests
