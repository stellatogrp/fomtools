name: Release to PyPI

# Publishes only when BOTH hold:
#   1. a tag matching v* is pushed, and
#   2. the tagged commit is on main.
# Tag the merge commit on main after the PR is merged, then push the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs the history and tags

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"

      - name: Build sdist and wheel
        run: uv build

      - name: Check the built version matches the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/fomtools-${VERSION}.tar.gz" \
            || { echo "::error::sdist for version $VERSION not found"; exit 1; }
          test -f dist/fomtools-"${VERSION}"-*.whl \
            || { echo "::error::wheel for version $VERSION not found"; exit 1; }

      - name: Smoke-test the wheel in a clean venv
        run: |
          uv venv /tmp/pkg-test
          uv pip install --python /tmp/pkg-test/bin/python dist/*.whl
          /tmp/pkg-test/bin/python -c "
          import fomtools
          assert fomtools.__version__ == '${GITHUB_REF_NAME#v}', fomtools.__version__
          from fomtools.verifier import Verifier
          Verifier()
          print('fomtools', fomtools.__version__, 'OK')
          "
          /tmp/pkg-test/bin/fomtools-codegen --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fomtools/
    permissions:
      id-token: write  # Trusted Publishing (OIDC); no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
