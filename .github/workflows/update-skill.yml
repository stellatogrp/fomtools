name: Update FOMTools Skill

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'fomtools/**'
      - 'CLAUDE.md'
      - '.claude/CLAUDE.md'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code to update skill
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: skills/update-prompt.md

          allowed_tools: |
            Bash(git status)
            Bash(git diff:*)
            Bash(git log:*)
            Bash(git add:*)
            Bash(git commit:*)
            Bash(find:*)
            Bash(grep:*)
            Bash(wc:*)
            Read
            Edit
            Write
