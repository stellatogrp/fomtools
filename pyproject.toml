[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fomtools"
description = "FOMTools: A Python Toolbox for Analysis of First-Order Methods"
readme = "README.md"
license = { text = "Apache 2.0" }
dynamic = ["version"]
authors = [
       { name = "Vinit Ranjan", email = "vranjan@princeton.edu" },
       { name = "Daniel Deza", email = "dd7022@princeton.edu" },
       { name = "Anushka Acharya", email = "aa9078@princeton.edu"},
       { name = "Jisun Park", email = "jisunpark@princeton.edu"},
       { name = "Bartolomeo Stellato", email = "bstellato@princeton.edu" },
]

dependencies = [
       "gurobipy>=12.0.1",
       "highspy",
       "numpy",
       "scipy",
]

[project.scripts]
fomtools-codegen = "fomtools.codegen.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"fomtools.codegen.agent" = ["agents.yaml"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]

# Code generation. The Claude Agent SDK is only needed to *run* the LLM coding
# agent; extracting the IR, scaffolding, building, and the ctypes wrapper need
# none of this (the wrapper uses the stdlib ``ctypes``). The Pi backend is a CLI
# (https://pi.dev), installed separately, so it needs no Python dependency here.
codegen = ["claude-agent-sdk", "openai-codex", "pydantic", "pyyaml"]

# CVXPYgen integration (fomtools.cvxpygen): model in CVXPY, canonicalize with
# CVXPYgen's generated C code, solve with a fomtools-generated embedded FOM.
# Pinned to the cvxpygen 1.x internal API (solver-interface seam).
cvxpygen = ["cvxpy", "cvxpygen>=1.0,<2", "osqp"]

dev = [
       "cvxpy",
       "pytest",
       "pre-commit",
       "ruff",
       "ruff-lsp",
       "ipdb",
       "hydra-core",
       "pandas",
       "pydantic",
       "networkx",
       "pepit",
]

nn = ["torch", "jax", "flax"]

docs = [
       "cvxpy",
       "marimo==0.23.9",
       "matplotlib",
       "mkdocs",
       "mkdocstrings-python",
       "mkdocs-marimo",
       "mkdocs-material",
       "pydantic",
       "pymdown-extensions",
       "networkx",
       "pepit",
]

[tool.mypy]
allow_redefinition = true
ignore_missing_imports = true
exclude = ["test"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
markers = [
    "agent: requires the real Claude coding agent (FOMTOOLS_CODEGEN_AGENT=1); skipped in CI",
    "requires_compiler: requires a C compiler to build generated solvers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build", "docs", "*__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
