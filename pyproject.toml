[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fomtools"
description = "FOMTools: A Python Toolbox for Verification of First-Order Methods"
readme = "README.md"
license = { text = "Apache 2.0" }
dynamic = ["version"]
authors = [
       { name = "Vinit Ranjan", email = "vranjan@princeton.edu" },
       { name = "Bartolomeo Stellato", email = "bstellato@princeton.edu" },
]

dependencies = [
       "numpy",
       "gurobipy>=12.0.1",
       "scipy",
       "highspy"
]

[tool.setuptools]
packages = ["fomtools"]

[project.optional-dependencies]
dev = [
       "cvxpy",
       "pytest",
       "pre-commit",
       "ruff",
       "ruff-lsp",
       "ipdb",
       "hydra-core",
       "pandas",
       "networkx",
       "pepit"
]

docs = [
       "cvxpy",
       "marimo",
       "matplotlib",
       "mkdocs",
       "mkdocstrings-python",
       "mkdocs-marimo",
       "mkdocs-material",
       "pymdown-extensions"
]

[tool.mypy]
allow_redefinition = true
ignore_missing_imports = true
exclude = ["test"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build", "docs", "*__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
