[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "algoverify"
description = "AlgoVerify: A Python Toolbox for Verification of First-Order Methods"
readme = "README.md"
license = { text = "Apache 2.0" }
dynamic = ["version"]
authors = [
       { name = "Vinit Ranjan", email = "vranjan@princeton.edu" },
       { name = "Bartolomeo Stellato", email = "bstellato@princeton.edu" },
]
dependencies = ["cvxpy", "jax"]

[tool.setuptools]
packages = ["algoverify"]

[project.optional-dependencies]
dev = [
       "gurobipy>=12.0.1",
       "pytest",
       "pre-commit",
       "ruff",
       "ruff-lsp",
       "matplotlib",
       "ipdb",
       "hydra-core",
       "pandas",
       "networkx",
]

docs = [
       "mkdocs",
       "mkdocstrings-python",
       "mkdocs-material"
]

[tool.mypy]
allow_redefinition = true
ignore_missing_imports = true
exclude = ["test"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build", "docs", "*__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
