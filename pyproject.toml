[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fomtools"
description = "FOMTools: A Python Toolbox for Analysis of First-Order Methods"
readme = "README.md"
license = { text = "Apache 2.0" }
dynamic = ["version"]
authors = [
       { name = "Vinit Ranjan", email = "vranjan@princeton.edu" },
       { name = "Daniel Deza", email = "dd7022@princeton.edu" },
       { name = "Anushka Acharya", email = "aa9078@princeton.edu"},
       { name = "Jisun Park", email = "jisunpark@princeton.edu"},
       { name = "Bartolomeo Stellato", email = "bstellato@princeton.edu" },
]

dependencies = [
       "gurobipy>=12.0.1",
       "highspy",
       "numpy",
       "scipy",
]

[tool.setuptools]
packages = ["fomtools"]

[project.optional-dependencies]
gpu = ["cupy-cuda11x"]

dev = [
       "cvxpy",
       "pytest",
       "pre-commit",
       "ruff",
       "ruff-lsp",
       "ipdb",
       "hydra-core",
       "pandas",
       "networkx",
]

docs = [
       "cvxpy",
       "marimo",
       "matplotlib",
       "mkdocs",
       "mkdocstrings-python",
       "mkdocs-marimo",
       "mkdocs-material",
       "pymdown-extensions"
]

[tool.mypy]
allow_redefinition = true
ignore_missing_imports = true
exclude = ["test"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build", "docs", "*__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
