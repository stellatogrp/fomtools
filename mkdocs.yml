site_name: Algo Verify
nav:
  - Home: index.md
  - Installation: installation.md
  - API and modules: api.md
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - mkdocstrings

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true        # outputs \( ... \) and \[ ... \]
      smart_dollar: true   # lets you use $...$ and $$...$$ in Markdown

extra_javascript:
  - javascripts/mathjax.js # Create this file in your docs/javascripts directory
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
