# Agent config for fomtools codegen.
#
# This file is loaded automatically: just edit it in place to add or tweak an
# agent and it is immediately available — no copying or env vars required.
# Each entry under `agents:` registers a headless coding-agent CLI as a backend
# you can select with `--agent <name>` or FOMTOOLS_CODEGEN_BACKEND=<name>.
#
# To override these per-user, or keep config outside the package, you can also
# use (later wins on a name clash):
#   ~/.config/fomtools/agents.yaml          # per-user config
#   $FOMTOOLS_CODEGEN_AGENTS                 # explicit path (takes precedence)
#
# Valid keys map 1:1 onto fomtools.codegen.agent.cli_specs.CliAgentSpec; an unknown
# key raises so typos surface loudly. `bin` is the only required key.

agents:
  # Claude Code (https://claude.com/claude-code), the default backend. Runs
  # `claude -p` headless in the output dir with the file and shell tools. The
  # PreToolUse hook enforces the phase's time budget: once FOMTOOLS_DEADLINE
  # (Unix time, set by fomtools) has passed, every tool call is refused with an
  # instruction to stop and summarize, a minute before the process is ended.
  # CLAUDE_CODE_DISABLE_BACKGROUND_TASKS keeps every Bash command in the
  # foreground: a background task (asked for, or a command that outlived the
  # Bash timeout) keeps `claude -p` waiting after its reply, until the phase
  # timeout ends it (#166).
  claude:
    bin: claude
    flags:
      - "-p"
      # Isolated from the user's own settings, CLAUDE.md, hooks, plugins, and MCP
      # servers, so results do not depend on whose machine runs them. The login
      # is kept; the deadline hook below comes in through --settings.
      - "--setting-sources"
      - ""
      - "--strict-mcp-config"
      # The event stream, reduced to the agent's text by fomtools, so a round
      # ended at its timeout keeps the notes written so far.
      - "--output-format"
      - "stream-json"
      - "--verbose"
      - "--permission-mode"
      - "bypassPermissions"
      - "--allowedTools"
      - "Read,Write,Edit,Bash,Glob,Grep"
      - "--settings"
      - '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1"},"hooks":{"PreToolUse":[{"matcher":"*","hooks":[{"type":"command","command":"[ -z \"$FOMTOOLS_DEADLINE\" ] || [ \"$(date +%s)\" -lt \"$FOMTOOLS_DEADLINE\" ] || { echo \"fomtools: the time budget is spent. Stop editing and print your summary now.\" >&2; exit 2; }"}]}]}}'
    cwd_flag: --add-dir
    sysprompt_flag: --append-system-prompt
    output_format: stream-json
    auth_markers: ["authentication_error", "invalid x-api-key", "please run /login", "claude login"]
    display_name: Claude Code
    auth_hint: Run `claude` once and log in.
    install_hint: Install Claude Code (https://claude.com/claude-code) and ensure `claude` is on PATH.

  # Claude Code, restricted (opt-in: `--agent claude-sandboxed`). The same entry
  # as `claude` except for what the agent may do:
  # - `acceptEdits` with `--permission-prompts none`: file edits inside the
  #   output dir are accepted, and anything that would need approval is denied
  #   instead of asked. No bare Write/Edit allow rule, which would cover any path.
  # - `--tools` limits the built-in tools to the six below (no web or subagents).
  # - Bash runs only the target's `make` targets and the binaries they build
  #   (read-only commands such as `ls` and `cat` need no rule).
  # - The Bash sandbox (Seatbelt on macOS, bubblewrap and socat on Linux)
  #   confines those commands, and so an edited Makefile or the solver itself:
  #   writes only in the output dir and $TMPDIR, no network. The run fails at
  #   startup if the sandbox cannot start, instead of running unsandboxed.
  # Reads are confined only by a list: the file tools are refused outside the
  # output dir, but a `make` recipe or a binary can read any file the user can,
  # except the well-known credential locations in `sandbox.filesystem.denyRead`
  # below (the same list as in `codex-sandboxed`; keep the two in step). The
  # list cannot be complete, and the environment is still inherited. To hide
  # more paths, add them to `denyRead` in a per-user copy of this entry.
  claude-sandboxed:
    bin: claude
    flags:
      - "-p"
      - "--setting-sources"
      - ""
      - "--strict-mcp-config"
      - "--output-format"
      - "stream-json"
      - "--verbose"
      - "--permission-mode"
      - "acceptEdits"
      - "--permission-prompts"
      - "none"
      - "--tools"
      - "Read,Write,Edit,Bash,Glob,Grep"
      - "--allowedTools"
      - "Bash(make *),Bash(./verify_bin *),Bash(./bench_bin *),Bash(./profile_bin *)"
      - "--settings"
      - '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1"},"sandbox":{"enabled":true,"failIfUnavailable":true,"allowUnsandboxedCommands":false,"autoAllowBashIfSandboxed":false,"filesystem":{"denyRead":["~/.ssh","~/.aws","~/.gnupg","~/.config/gh","~/.config/gcloud","~/.azure","~/.kube","~/.docker","~/.netrc","~/.npmrc","~/.pypirc","~/.git-credentials"]}},"hooks":{"PreToolUse":[{"matcher":"*","hooks":[{"type":"command","command":"[ -z \"$FOMTOOLS_DEADLINE\" ] || [ \"$(date +%s)\" -lt \"$FOMTOOLS_DEADLINE\" ] || { echo \"fomtools: the time budget is spent. Stop editing and print your summary now.\" >&2; exit 2; }"}]}]}}'
    cwd_flag: --add-dir
    sysprompt_flag: --append-system-prompt
    output_format: stream-json
    auth_markers: ["authentication_error", "invalid x-api-key", "please run /login", "claude login"]
    display_name: Claude Code (sandboxed)
    auth_hint: Run `claude` once and log in.
    install_hint: Install Claude Code (https://claude.com/claude-code) and ensure `claude` is on PATH.

  # OpenAI Codex CLI (https://github.com/openai/codex): `codex exec` in the
  # output dir (not a git repo), with approvals and the sandbox bypassed since
  # the dir is isolated. The time budget is the process timeout.
  codex:
    bin: codex
    base_args: ["exec"]
    # Isolated from the user's ~/.codex/config.toml (hooks, MCP servers, profiles,
    # a pinned model) and execpolicy rules; no session files. The login is kept.
    # Codex still reads ~/.codex/AGENTS.md; no flag turns that off.
    flags:
      - "--skip-git-repo-check"
      - "--dangerously-bypass-approvals-and-sandbox"
      - "--ignore-user-config"
      - "--ignore-rules"
      - "--ephemeral"
    cwd_flag: --cd
    display_name: Codex
    auth_hint: Run `codex login`.
    install_hint: Install the Codex CLI (https://github.com/openai/codex) and ensure `codex` is on PATH.

  # Codex, restricted (opt-in: `--agent codex-sandboxed`). The same entry as
  # `codex` with the bypass replaced by a permissions profile, `fomtools`, that
  # extends the built-in `:workspace` one (the workspace-write sandbox):
  # commands write only in the output dir, /tmp and $TMPDIR, and have no
  # network. `codex exec` never asks for approval, so a command the sandbox
  # blocks fails. Any command may run. Reads are confined only by a list: the
  # profile denies the well-known credential locations below (the same list as
  # in `claude-sandboxed`; keep the two in step) and nothing else. The list
  # cannot be complete, and the environment is still inherited. To hide more
  # paths, add `"<path>"="deny"` entries in a per-user copy of this entry.
  codex-sandboxed:
    bin: codex
    base_args: ["exec"]
    flags:
      - "--skip-git-repo-check"
      - "-c"
      - 'default_permissions="fomtools"'
      - "-c"
      - 'permissions.fomtools.extends=":workspace"'
      - "-c"
      - 'permissions.fomtools.filesystem={"~/.ssh"="deny","~/.aws"="deny","~/.gnupg"="deny","~/.config/gh"="deny","~/.config/gcloud"="deny","~/.azure"="deny","~/.kube"="deny","~/.docker"="deny","~/.netrc"="deny","~/.npmrc"="deny","~/.pypirc"="deny","~/.git-credentials"="deny"}'
      - "--ignore-user-config"
      - "--ignore-rules"
      - "--ephemeral"
    cwd_flag: --cd
    display_name: Codex (sandboxed)
    auth_hint: Run `codex login`.
    install_hint: Install the Codex CLI (https://github.com/openai/codex) and ensure `codex` is on PATH.

  # Pi (https://pi.dev): one-shot print mode, trusting the files in the output
  # dir. Pi is multi-provider and uses its own login or provider keys. The time
  # budget is the process timeout. No restricted variant: pi can switch whole
  # tools off (`--tools`) but cannot limit what its bash tool runs or writes.
  pi:
    bin: pi
    flags: ["--print", "--approve"]
    display_name: Pi
    auth_hint: Run `pi` and use /login.
    install_hint: Install Pi (https://pi.dev) and ensure `pi` is on PATH.

  # Cursor CLI agent (https://cursor.com/docs/cli). Drives `cursor-agent` in
  # non-interactive mode, looping internally on the workspace until it stops.
  cursor:
    bin: cursor-agent
    # --print: non-interactive (print to stdout instead of launching the TUI).
    # --force: auto-approve file edits / shell commands (alias: --yolo).
    flags: ["--print", "--force"]
    # The prompt is passed POSITIONALLY (`cursor-agent ... "<prompt>"`), so do
    # not set `prompt_arg`. cursor-agent has no system-prompt flag, so the shared
    # SYSTEM_PROMPT is automatically prepended to the task prompt.
    model_flag: --model            # e.g. --agent cursor with model "sonnet-4.5"
    display_name: Cursor
    auth_hint: Run `cursor-agent login`.
    install_hint: Install the Cursor CLI (https://cursor.com/docs/cli) and ensure `cursor-agent` is on PATH.
